name: Build Zentrax VIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Zentrax
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Install Theos Framework
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: 📱 Install Patched iOS SDKs
        run: |
          rm -rf $THEOS/sdks
          git clone https://github.com/theos/sdks.git $THEOS/sdks

      - name: 🔐 Install ldid
        run: |
          brew install ldid
          which ldid
          brew list --versions ldid

      - name: 🔧 Fix ChOma Headers
        run: |
          echo "Checking ChOma structure..."
          ls -la XPF/external/ChOma
          ls -la XPF/external/ChOma/src
          ls -la XPF/external/ChOma/include || true

          rm -rf XPF/external/ChOma/include/choma
          mkdir -p XPF/external/ChOma/include/choma

          cp XPF/external/ChOma/src/*.h XPF/external/ChOma/include/choma/

          echo "ChOma headers installed:"
          ls -la XPF/external/ChOma/include/choma

      - name: 🔍 Check All Files
        run: |
          echo "Checking ChOma..."
          find XPF/external/ChOma -maxdepth 3 -type f | sort

          echo "Checking required header..."
          test -f XPF/external/ChOma/include/choma/Fat.h

          echo "Fat.h found successfully"

      - name: 🔨 Build Package (DEB)
        run: |
          make package FINALPACKAGE=1

      - name: 📦 Build Release IPA
        run: |
          mkdir -p packages

          test -f base/FilzaSlop-v1.0.0-unsigned.ipa

          echo "Base IPA found:"
          ls -lh base/FilzaSlop-v1.0.0-unsigned.ipa

          chmod +x scripts/build_release_ipa.sh

          bash scripts/build_release_ipa.sh \
            base/FilzaSlop-v1.0.0-unsigned.ipa \
            packages/Zentrax-VIP-Unsigned.ipa

          test -f packages/Zentrax-VIP-Unsigned.ipa

          echo "Final IPA created:"
          ls -lh packages/Zentrax-VIP-Unsigned.ipa

      - name: 🚀 Upload Final Release
        uses: actions/upload-artifact@v4
        with:
          name: Zentrax-VIP-Release
          path: |
            packages/*.deb
            packages/*.ipa
            *.ipa