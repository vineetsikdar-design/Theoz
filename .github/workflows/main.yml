name: Build Zentrax VIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Ye tumhe manually compile button dabane ka option dega

jobs:
  build:
    name: Compile Zentrax
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ⚙️ Install Theos Framework
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: 📱 Install Patched iOS SDKs
        run: |
          git clone https://github.com/theos/sdks.git $THEOS/sdks

      - name: 🔨 Build Package (DEB)
        run: |
          make package FINALPACKAGE=1

      - name: 📦 Build Release IPA (TrollStore)
        run: |
          chmod +x scripts/build_release_ipa.sh
          bash scripts/build_release_ipa.sh
        continue-on-error: true # Agar script fail hui toh bhi DEB upload ho jayega

      - name: 🚀 Upload Final Release
        uses: actions/upload-artifact@v4
        with:
          name: Zentrax-VIP-Release
          path: |
            packages/*.deb
            packages/*.ipa
            *.ipa
